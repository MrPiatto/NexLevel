name: Core tests
on:
  push:
  pull_request:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/core --config Debug
      - name: Test
        run: ctest --test-dir build/core -C Debug --output-on-failure
