# NexLevel build for GD 2.209x (Geode v6). One workflow per target so the combine step only merges this target's platforms.
name: Build GD 2.209x (Geode v6)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: Windows,   os: windows-latest }
          - { name: macOS,     os: macos-latest }
          - { name: iOS,       os: macos-latest,  target: iOS }
          - { name: Android32, os: ubuntu-latest, target: Android32 }
          - { name: Android64, os: ubuntu-latest, target: Android64 }
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: compat/gd2209-geode6
          # PHASE 1 CHECK: the action documents only 'latest' / 'nightly'. Confirm a tag pin works;
          # if not, replace with explicit steps that clone geode-sdk/geode at this tag.
          sdk: v6.0.0-alpha.1
          combine: true
          target: ${{ matrix.config.target }}
  package:
    name: Package GD 2.209x (Geode v6)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod@combine
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: nexlevel-gd2209
          path: ${{ steps.build.outputs.build-output }}
