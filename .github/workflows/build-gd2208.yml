# NexLevel build for GD 2.2081 (Geode v5). v1 targets Windows only (mod.json "gd": {"win": ...}).
name: Build GD 2.2081 (Geode v5)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: compat/gd2208-geode5
          sdk: v5.10.1
          combine: false
      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: nexlevel-gd2208
          path: ${{ steps.build.outputs.build-output }}
